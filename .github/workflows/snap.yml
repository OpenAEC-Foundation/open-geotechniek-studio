name: Build Snap Package

on:
  # workflow_run werkt alleen als dit workflowbestand op de DEFAULT branch staat.
  # De workflow wordt getriggerd zodra "Signed desktop release"
  # afrondt na een tag-push. Andere builds publiceren alleen via Snap-dispatch.
  workflow_run:
    workflows: ["Signed desktop release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Bestaande release-tag om tegen te bouwen (test)'
        required: true
        default: 'v0.4.0'
      publish:
        # Backfill-route: publiceren gebeurt normaal alleen via workflow_run
        # na een echte release. Deze snap-pijplijn is echter TOEGEVOEGD NA de
        # huidige release, dus er bestaat geen release-event om aan te haken en
        # de Store zou tot de volgende release blijven hangen op een oude versie.
        # Bewust default false: aanzetten is onomkeerbaar (een Snap-release is
        # niet in te trekken).
        description: 'Ook publiceren naar het stable-kanaal van de Snap Store (ONOMKEERBAAR)'
        type: boolean
        required: false
        default: false
      sign_existing:
        description: 'Alleen de bestaande GitHub Snap-download ondertekenen; geen herbouw of Store-publicatie'
        type: boolean
        required: false
        default: false

# Minimale default; de build-snap-job zet zelf `contents: write` omdat hij de
# snap als asset aan de release hangt.
permissions:
  contents: read

# Eén globale groep, NIET annuleren: twee releases kort na elkaar publiceren
# allebei naar het `stable`-kanaal van de Snap Store, en een Snap-release is
# niet in te trekken.
concurrency:
  group: snap
  cancel-in-progress: false

jobs:
  build-snap:
    # Ruim boven de snapcraft-bouwtijd, maar begrensd: deze job bevat een
    # poll-lus (max ~2,5 min) plus een snapcraft-build in een VM.
    timeout-minutes: 75
    runs-on: ubuntu-22.04
    # `types: [completed]` vuurt OOK als de release-workflow faalde of werd
    # geannuleerd; zonder deze gate zou een mislukte release alsnog een snap bouwen.
    # Candidate builds and desktop dispatches on main have no unambiguous release
    # tag. Use an explicit Snap dispatch for those; never pick the latest release.
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.sign_existing) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v20'))
    permissions:
      contents: write
    env:
      # Job-level zodat de gated publish-stap er in `if:` naar kan verwijzen.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Bij workflow_run checkt checkout standaard de DEFAULT BRANCH uit,
          # niet de tag/commit die de release-workflow bouwde — fout, want
          # snap/snapcraft.yaml moet van de gebouwde commit komen. Daarom
          # expliciet de head_sha van die workflow; voor workflow_dispatch
          # (geen workflow_run-event) valt die weg naar github.ref (de branch
          # waarop handmatig werd gedispatcht).
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Get version
        id: get-version
        env:
          # Niet-vertrouwde invoer via env, NOOIT rechtstreeks ${} in de shell.
          # GITHUB_*-namen zelf NIET zetten: gereserveerd en al aanwezig in de runner.
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          elif [ "$EVENT_NAME" = "workflow_run" ]; then
            VERSION="$HEAD_BRANCH"
          else
            VERSION=""
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Kon geen versie afleiden (event=$EVENT_NAME, head_branch=$HEAD_BRANCH)"
            exit 1
          fi
          # `version` en `version_number` gaan verderop een `sed`-VERVANGINGSPATROON
          # in, en een dispatch-input is vrije tekst — een '/' of '&' herschrijft dat
          # patroon, een nieuwe regel schrijft een tweede regel in $GITHUB_OUTPUT
          # (output-injectie). Whitelist: de `case` dekt de hele waarde (dus ook
          # nieuwe regels), de regex daarna de structuur.
          case "$VERSION" in
            *[!v0-9.]*)
              echo "::error::Versie bevat tekens buiten 'v', cijfers en punten." >&2
              exit 1
              ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versie '$VERSION' heeft niet de vorm vX.Y.Z." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      # We bouwen de Tauri-app NIET opnieuw: de snap herverpakt de deb van de
      # gepubliceerde GitHub-release (zelfde artifact als de overige Linux-downloads).
      - name: Wait for release deb and download it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          echo "Wachten op deb-asset van release $VERSION..."
          found=""
          for i in $(seq 1 10); do
            if gh release view "$VERSION" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '_amd64\.deb$'; then
              found=1
              echo "deb-asset gevonden"
              break
            fi
            echo "nog geen deb-asset... (poging $i/10)"
            sleep 15
          done
          if [ -z "$found" ]; then
            echo "::error::deb-asset voor $VERSION verscheen niet op tijd"
            exit 1
          fi
          gh release download "$VERSION" -p '*_amd64.deb' --clobber --dir .
          deb=$(ls *_amd64.deb | head -1)
          cp "$deb" open-geotechniek-studio.deb
          echo "Gebruik $deb -> open-geotechniek-studio.deb"

      - name: Set version in snapcraft.yaml
        env:
          VERSION_NUMBER: ${{ steps.get-version.outputs.version_number }}
        run: |
          sed -i "s/^version: .*/version: '$VERSION_NUMBER'/" snap/snapcraft.yaml
          grep '^version:' snap/snapcraft.yaml

      - name: Build snap
        uses: snapcore/action-build@v1
        id: snapcraft

      - uses: actions/setup-node@v5
        if: github.event_name == 'workflow_run' || inputs.publish
        with:
          node-version: 22

      - name: Sign and verify Snap and its checksum manifest
        if: github.event_name == 'workflow_run' || inputs.publish
        env:
          SNAP: ${{ steps.snapcraft.outputs.snap }}
          OPENAEC_GPG_PRIVATE_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY }}
          OPENAEC_GPG_PASSPHRASE: ${{ secrets.OPENAEC_GPG_PASSPHRASE }}
          OPENAEC_GPG_FINGERPRINT: ${{ vars.OPENAEC_GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          mkdir snap-artifacts
          cp "$SNAP" snap-artifacts/
          node scripts/ci/checksums.mjs snap-artifacts
          bash scripts/ci/sign-linux.sh snap-artifacts SHA256SUMS-snap.txt
          cd snap-artifacts
          sha256sum --check SHA256SUMS-snap.txt

      # Separate manifest: do not overwrite the desktop release's signed checksums.
      - name: Upload signed Snap to GitHub release
        if: github.event_name == 'workflow_run' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          gh release upload "$VERSION" snap-artifacts/*.snap snap-artifacts/*.snap.asc \
            snap-artifacts/SHA256SUMS-snap.txt snap-artifacts/SHA256SUMS-snap.txt.asc --clobber

      - name: Verify downloaded Snap release assets
        if: github.event_name == 'workflow_run' || inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get-version.outputs.version }}
          SNAP: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          snap_name=$(basename "$SNAP")
          gh release download "$VERSION" --dir snap-downloads \
            --pattern "$snap_name" --pattern "$snap_name.asc" \
            --pattern SHA256SUMS-snap.txt --pattern SHA256SUMS-snap.txt.asc
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import snap-artifacts/linux-signing-public-key.asc
          cd snap-downloads
          gpg --batch --verify SHA256SUMS-snap.txt.asc SHA256SUMS-snap.txt
          sha256sum --check SHA256SUMS-snap.txt
          gpg --batch --verify "$snap_name.asc" "$snap_name"

      # Handmatige test: snap als CI-artifact (de release NIET aanraken).
      - name: Upload snap as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: open-geotechniek-studio-snap
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

      # Live publiceren naar de Snap Store: alleen op een echte release én pas
      # zodra het store-credentials-secret bestaat (eigenaar-stap) — én pas
      # zodra de naam `open-geotechniek-studio` op snapcraft.io geregistreerd is.
      - name: Publish to Snap Store
        if: >-
          env.SNAPCRAFT_STORE_CREDENTIALS != '' &&
          (github.event_name == 'workflow_run' ||
           (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: stable

  sign-existing:
    if: github.event_name == 'workflow_dispatch' && inputs.sign_existing
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download the existing Snap without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            echo 'sign_existing cannot be combined with Store publication' >&2
            exit 1
          fi
          [[ "$VERSION" =~ ^v20[0-9]{2}\.[1-9][0-9]?\.[0-9]+$ ]]
          snap_name="open-geotechniek-studio_${VERSION#v}_amd64.snap"
          gh release download "$VERSION" --pattern "$snap_name" --dir snap-artifacts
          node scripts/ci/checksums.mjs snap-artifacts
      - name: Sign and verify the existing download
        env:
          OPENAEC_GPG_PRIVATE_KEY: ${{ secrets.OPENAEC_GPG_PRIVATE_KEY }}
          OPENAEC_GPG_PASSPHRASE: ${{ secrets.OPENAEC_GPG_PASSPHRASE }}
          OPENAEC_GPG_FINGERPRINT: ${{ vars.OPENAEC_GPG_FINGERPRINT }}
        run: bash scripts/ci/sign-linux.sh snap-artifacts SHA256SUMS-snap.txt
      - name: Publish signatures and verify downloaded release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          snap_name="open-geotechniek-studio_${VERSION#v}_amd64.snap"
          # Upload only new verification files; never replace the released binary.
          gh release upload "$VERSION" "snap-artifacts/$snap_name.asc" \
            snap-artifacts/SHA256SUMS-snap.txt snap-artifacts/SHA256SUMS-snap.txt.asc --clobber
          gh release download "$VERSION" --dir snap-downloads \
            --pattern "$snap_name" --pattern "$snap_name.asc" \
            --pattern SHA256SUMS-snap.txt --pattern SHA256SUMS-snap.txt.asc
          export GNUPGHOME
          GNUPGHOME=$(mktemp -d)
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --import snap-artifacts/linux-signing-public-key.asc
          cd snap-downloads
          gpg --batch --verify SHA256SUMS-snap.txt.asc SHA256SUMS-snap.txt
          sha256sum --check SHA256SUMS-snap.txt
          gpg --batch --verify "$snap_name.asc" "$snap_name"

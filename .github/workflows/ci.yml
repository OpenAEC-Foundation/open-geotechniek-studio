name: CI

# Snelle poort op elke push/PR naar main: typecheck + unit-tests van de
# frontend. Bewust GEEN cargo build — die heeft de crates-warehouse-
# checkout en een volledige Tauri-toolchain nodig (zie release.yml) en
# duurt tienvoudig; die dekking komt bij de release-build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Blueprint version consistency
        run: |
          python3 ../../scripts/version.py --check
          node ../../scripts/check-blueprint.mjs
          python3 ../../scripts/test-release.py

      - name: Headless core and external HTTP/MCP clients
        run: |
          node ../../scripts/build-core.mjs
          node --test ../../packages/core/test.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Differential GEF interpretation tests
        run: |
          python -m pip install pygef==0.14.1
          OGS_TEST_PYTHON=python node ../../scripts/differential-parsers.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Alleen paaldraagvermogen is publiek beschikbaar.
      - name: Build public web bundle
        run: VITE_PUBLIC_WEB=1 npm run build

      - name: Verify public calculation scope
        run: |
          grep -rq -- "NEN 6743" dist/assets/*.js
          for term in "Modulus naar kPa" "Verticale ontwerpweerstand"; do
            if grep -rq -- "$term" dist/assets/*.js; then
              echo "::error::Niet-vrijgegeven rekenmodule in publieke bundle: $term"
              exit 1
            fi
          done
          echo "Publieke bundle bevat paaldraagvermogen; poer en zetting zijn uitgesloten."

  native-sdk:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: cargo test --locked --manifest-path packages/native/Cargo.toml
      - run: cargo build --locked --release --manifest-path packages/native/Cargo.toml
      - name: External C ABI consumer
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) library=openaec_geotechniek.dll ;;
            macOS) library=libopenaec_geotechniek.dylib ;;
            *) library=libopenaec_geotechniek.so ;;
          esac
          python packages/native/test-consumer.py "packages/native/target/release/$library"

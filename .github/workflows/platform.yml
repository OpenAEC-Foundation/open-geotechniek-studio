name: Build platform bundle
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact release tag or commit SHA'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Verify pinned source
        env:
          BUILD_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          if [[ "$BUILD_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "$(git rev-parse HEAD)" = "${BUILD_REF,,}"
          else
            tag="${BUILD_REF#refs/tags/}"
            test "$(git rev-parse --verify "refs/tags/${tag}^{commit}")" = "$(git rev-parse HEAD)"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run build:platform
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: open-geotechniek-platform
          path: apps/desktop/dist-platform
